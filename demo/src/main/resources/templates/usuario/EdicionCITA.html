<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">


<head th:insert="~{/usuario/template_usuario.html::head}"> </head>

<body>

	<div th:insert="~{/usuario/template_usuario.html::sidebar}"> </div>

	<!-- ======== main-wrapper start =========== -->
	<main class="main-wrapper">

		<div th:insert="~{/usuario/template_usuario.html::header}"></div>

		<!-- ========== tab components start ========== -->
		<section class="tab-components">
			<div class="container-fluid">
				<!-- ========== title-wrapper start ========== -->
				<div class="title-wrapper pt-30">
					<div class="row align-items-center">
						<div class="col-md-6">
							<div class="title">
								<h2>Edición de citas</h2>
							</div>
						</div>
						<!-- end col -->
						<div class="col-md-6">
							<div class="breadcrumb-wrapper">
								<nav aria-label="breadcrumb">
									<ol class="breadcrumb">
										<li class="breadcrumb-item">
											<a href="#">Historial</a>
										</li>
										<li class="breadcrumb-item">
											<a href="#">Historial de citas</a>
										</li>
										<li class="breadcrumb-item active" aria-current="page">
											Edición de citas
										</li>
									</ol>
								</nav>
							</div>
						</div>
						<!-- end col -->
					</div>
					<!-- end row -->
				</div>
				<!-- ========== title-wrapper end ========== -->

				<!-- ========== form-elements-wrapper start ========== -->
				<div class="form-elements-wrapper">
					<div class="row">
						<div class="col-lg-12">

							<!-- input style start -->
							<div class="card-style mb-30">
								<h6 class="mb-25">Formulario de registros</h6>

								<form th:action="@{/usuario/SendActCit}" method="post">
									<input type="hidden" name="id" th:value="${Ok.id}" />

									<div class="row g-3">
										<!-- Fecha y hora -->
										<div class="col-md-6">
											<div class="input-style-1">
												<label>Fecha y hora</label>
												<input type="datetime-local" name="fecha_hora"
													th:value="${#dates.format(Ok.fecha_hora, 'yyyy-MM-dd\'T\'HH:mm')}"
													required />
											</div>
										</div>

										<!-- Doctor / Usuario -->
										<div class="col-md-6">
											<div class="select-style-1">
												<div class="select-position">
													<label>Doctor</label>
													<select name="usuario.id">
														<option th:each="u : ${usuarios}" th:value="${u.id}"
															th:text="${u.profesional != null ? u.nombre + ' - ' + u.profesional.especialidad : u.nombre}"
															th:selected="${u.id == Ok.usuario.id}">
														</option>
													</select>
												</div>
											</div>
										</div>

										<!-- Servicio -->
										<div class="col-md-12">
											<div class="select-style-1">
												<div class="select-position">
													<label>Servicio</label>
													<select name="servicio.id">
														<option th:each="s : ${servicios}" th:value="${s.id}"
															th:text="${s.nombre + ' - ' + s.descripcion}"
															th:selected="${s.id == Ok.servicio.id}">
														</option>
													</select>
												</div>
											</div>
										</div>

										<div class="col-12 text-center">
											<button type="submit" class="btn btn-primary btn-submit">ACTUALIZAR</button>
										</div>
									</div>
								</form>


							</div>


						</div>

					</div>
				</div>
				<!-- end container -->
		</section>
		<!-- ========== tab components end ========== -->
		<div th:insert="~{/usuario/template_usuario.html::footer}"></div>

	</main>
	<!-- ======== main-wrapper end =========== -->

	<div th:insert="~{/usuario/template_usuario.html::jsFiles}"></div>
</body>

</html>

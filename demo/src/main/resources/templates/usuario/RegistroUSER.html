<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeLeaf.org">


<head th:insert="~{/usuario/template_usuario.html::head}"> </head>

<body>

	<div th:insert="~{/usuario/template_usuario.html::sidebar}"> </div>

	<!-- ======== main-wrapper start =========== -->
	<main class="main-wrapper">

		<div th:insert="~{/usuario/template_usuario.html::header}"></div>

		<!-- ========== tab components start ========== -->
		<section class="tab-components">
			<div class="container-fluid">
				<!-- ========== title-wrapper start ========== -->
				<div class="title-wrapper pt-30">
					<div class="row align-items-center">
						<div class="col-md-6">
							<div class="title">
								<h2>Form Elements</h2>
							</div>
						</div>
						<!-- end col -->
						<div class="col-md-6">
							<div class="breadcrumb-wrapper">
								<nav aria-label="breadcrumb">
									<ol class="breadcrumb">
										<li class="breadcrumb-item">
											<a href="#">Registros</a>
										</li>
										<li class="breadcrumb-item"><a href="#">Usuarios</a></li>
										<li class="breadcrumb-item active" aria-current="page">
											Crear
										</li>
									</ol>
								</nav>
							</div>
						</div>
						<!-- end col -->
					</div>
					<!-- end row -->
				</div>
				<!-- ========== title-wrapper end ========== -->

				<!-- ========== form-elements-wrapper start ========== -->
				<div class="form-elements-wrapper">
					<div class="row">
						<div class="col-lg-12">
							<form>
								<!-- input style start -->
								<div class="card-style mb-30">
									<h6 class="mb-25">Formulario de registros</h6>

									<form th:action="@{/usuario/GuardarUSER}" method="post">
										<div class="row g-3">
											<div class="col-md-6">
												<div class="form-group">
													<div class="input-with-icon">
														<i class="bi bi-person"></i>
														<input type="text" class="form-control" id="nombre"
															name="nombre" placeholder="Nombre completo" required
															autocomplete="off">
													</div>
												</div>
											</div>

											<div class="col-md-6">
												<div class="form-group">
													<div class="input-with-icon">
														<i class="bi bi-envelope"></i>
														<input type="email" class="form-control" id="email" name="email"
															placeholder="Correo electrónico" required
															autocomplete="off">
													</div>
												</div>
											</div>
											<div class="col-md-4">
												<div class="form-group">
													<div class="input-with-icon">
														<i class="bi bi-telephone"></i>
														<input type="number" class="form-control" id="telefono"
															name="telefono" placeholder="Teléfono" required
															autocomplete="off">
													</div>
												</div>
											</div>

											<div class="col-md-3">
												<div class="form-group">
													<div class="input-with-icon">
														<i class="bi bi-lock"></i>
														<input type="password" class="form-control" id="password"
															name="password" placeholder="Asignar contraseña" required
															autocomplete="off">
													</div>
												</div>
											</div>
											<div class="col-md-3">
												<div class="form-group">
													<div class="input-with-icon">
														<i class="bi bi-123"></i>
														<select class="form-control" id="ficha" name="ficha.idFicha"
															autocomplete="off">
															<option value="" class="centrados">------ Ficha ------
															</option>
															<option th:each="espe : ${especializacion}"
																th:value="${espe.id}" th:text="${espe.especialidad}">
															</option>
														</select>
													</div>
												</div>
											</div>
											<div class="input-style-1">
												<label>Date</label>
												<input type="date" />
											</div>

											<div class="col-12 text-center">
												<button type="submit"
													class="btn btn-primary btn-submit">REGISTRAR</button>
											</div>
										</div>
									</form>
									
								</div>

							</form>
						</div>
				
					</div>
				</div>
				<!-- end container -->
		</section>
		<!-- ========== tab components end ========== -->
		<div th:insert="~{/usuario/template_usuario.html::footer}"></div>

	</main>
	<!-- ======== main-wrapper end =========== -->

	<div th:insert="~{/usuario/template_usuario.html::jsFiles}"></div>
</body>

</html>
